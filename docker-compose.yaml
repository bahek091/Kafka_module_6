version: '3.8'


services:
  nifi:
   image: apache/nifi:1.21.0
   container_name: nifi
   user: "root"
   ports:
     - "8080:8080"
   environment:
     NIFI_WEB_HTTP_PORT: 8080
   volumes:
     - ./nifi_data:/opt/nifi/nifi-current/data
     - ./nifi-certs:/opt/nifi/nifi-current/certs:ro
   networks:
     - confluent


volumes:
 nifi_data:


networks:
 confluent: